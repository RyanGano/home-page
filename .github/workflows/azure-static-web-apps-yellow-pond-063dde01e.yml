name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      # Static Web Apps uses repo_token to post the preview-environment comment on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Dependabot-triggered runs get no repository secrets, so the deploy action cannot run
      # for them. Build on the runner instead, so a dependency update still proves the build.
      - name: Set up Node.js (Dependabot)
        if: github.actor == 'dependabot[bot]'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: |
          npm ci
          npm run build
      - name: Build And Deploy
        id: builddeploy
        if: github.actor != 'dependabot[bot]'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_POND_063DDE01E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    # Dependabot PRs never create a preview environment (see above), so there is nothing to close.
    # Keyed on the PR author, since whoever merges or closes it is the actor here.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_POND_063DDE01E }}
          action: "close"
